[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llm-sdk",
    "mypy>=2.3.1",
    "numpy>=2.4.6",
    "pydantic>=2.13.5",
]

[project.scripts]
call-me-maybe = "src.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "src"

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.uv.workspace]
members = ["llm_sdk"]